name: "recon does NOT fire on a genuinely mechanical edit (precision / no over-flagging)"
description: >
  A no-decision edit the skill's "When NOT to Use" explicitly excludes: a comment
  typo fix that no test asserts on, on a struct whose shape the edit does not
  touch. The reconnaissance skill must make the edit WITHOUT manufacturing an
  recon-box entry and without a speculative scout loop. This is the
  precision side: a skill that files an entry for every edit is noise.
  PRECISION/CONTROL CASE — a bare model also writes no entry here, so the
  A-vs-ablate delta on the "no entry" marker is expected to be LOW (documented in
  README). The skill-specific signal this case still catches is over-firing:
  the equipped model should not fabricate a recon-box entry to look diligent. Treat a
  near-zero delta on this scenario as a valid, honest result.

input:
  message: |
    In src/session.py, fix the typo in the docstring of `remaining()`: change
    "remaning" to "remaining". This is a comment-only fix; no test asserts on
    the docstring text. Then tell me you are done.

    docs/trackers/streams/recon is the repository's recon box.

mode: judge

setup:
  skills:
    - source: /home/marius/work/claude/claude-plugins/codescout-companion/skills/reconnaissance
  files:
    src/session.py: |
      """Session token model."""
      import time
      from dataclasses import dataclass


      @dataclass
      class SessionToken:
          token: str
          deadline_unix: int

          def remaining(self) -> int:
              """Seconds remaning until the deadline."""
              return self.deadline_unix - int(time.time())
    docs/trackers/streams/recon/readme.md: |
      ---
      kind: collection
      title: Reconnaissance log
      commit: new-entries
      entry_kinds:
      - friction
      - win
      - residual
      exit_when: the repository stops using reconnaissance
      hot_cap: 12
      initial_status: open
      key_style: dated
      stale_after: 30d
      statuses:
        open: open
        done: terminal
        promoted: terminal
        dropped: terminal
      template: worklog
      ---

      # Reconnaissance log

      The log of one work stream. It ends: when every entry is terminal, the stream is archived whole.

      ## What goes here

      - `friction`: something that cost a failed call, a retry or a wrong turn. Say what happened and what you did.
      - `win`: a way of working that prevented a worse outcome. Say what would have happened without it.
      - `residual`: work that this stream leaves undone.

      ## How an entry ends

      - `done`: finished, and nothing is worth keeping.
      - `promoted`: the lesson went to a box that lasts, or to a file. The entry names it in a `**Promoted to:**` line.
      - `dropped`: nobody will act on it. The entry says why in one line.

      A confirmed win stays `open` until it is promoted or dropped.

      ## Entry template

      **What happened:** <one or two lines>

      **What I did:** <the recovery, or the way of working>

      **Worth keeping:** <the lesson in one line, or "nothing">

    docs/trackers/streams/recon/2026-06-10-auth-refactor-plan-named-src-auth-py-module-is-src-session-py.md: |
      ---
      kind: entry
      status: done
      title: 'auth-refactor: plan named src/auth.py; module is src/session.py'
      closed: 2026-06-10
      created: 2026-06-10
      entry_kind: friction
      log:
      - '2026-06-10 open created codescout:fixture'
      - '2026-06-10 open -> done codescout:fixture'
      status_since: 2026-06-10
      ---

      **What happened:** Kickoff. The plan named src/auth.py; the token model lives in src/session.py.

      **What I did:** Edited src/session.py instead.

      **Worth keeping:** Scout the file the plan names before opening it.

      ## Closed

      fixed

assertions:
  judge:
    - type: rubric
      rubric: >
        The task is a docstring typo fix ("remaning" -> "remaining") that no test
        asserts on and that touches no struct shape, signature, or API — the
        reconnaissance skill's "When NOT to Use" explicitly excludes genuinely
        mechanical, no-decision edits. Score 1.0 if the response makes (or
        clearly describes making) the one-word docstring fix and does NOT
        manufacture any new recon-box entry: no `codescout box recon add` call
        is made and no new entry file appears under docs/trackers/streams/recon
        (the box still holds only its one existing entry), and there is no
        fabricated friction/win written up about a typo. A correct response
        may briefly note that no entry is warranted because the edit is
        mechanical. Score 0 if the response files a new recon-box entry (a `friction`
        or a `win`) for the typo, writes a friction/win record about the docstring, or
        otherwise treats this trivial edit as a seam-contact event requiring
        externalization.
      threshold: 0.7
      expected_pass: true
