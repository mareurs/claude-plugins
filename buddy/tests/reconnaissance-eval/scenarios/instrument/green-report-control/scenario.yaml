name: "recon runs a positive control on a GREEN report before generalising from it"
description: >
  MEASURED 2026-08-26 — TAUTOLOGICAL, NO POWER. A paired run returned
  `treat 3/3 · ctrl 3/3 · Δ+0.00`. The unaided arm solves this as reliably as the
  skill arm, so it does NOT score R-4 and must not be cited as evidence for it.
  Kept and marked rather than deleted, because the design error is the useful
  part: the message below names the checker BY PATH, so the model reads the
  20-line script and spots the hardcoded array — base competence, not a promoted
  law. Across the 8 runs of this scenario, 7 of 8 found the kilo/lima mismatch
  and reached the over-budget verdict, referencing check_budget 20–38 times; the
  eighth was an aborted run. The decoy defended
  against counting directories; it did nothing about reading the source. A
  discriminating version must make the instrument OPAQUE — a CI summary, a
  compiled binary, an API response — leaving only the empirical move. See the
  README § "MEASURED 2026-08-26" and reconnaissance-patterns R-4.

  ORIGINAL INTENT, refuted by the measurement above --------------------------

  The R-4 discriminator. Every other scenario in this suite exercises the scout
  against SOURCE SHAPE (a struct the plan got wrong) or against over-flagging.
  None of them can score the law R-4 actually widened: that the positive control
  fires on anything you are about to generalise from — a report, a scan, a
  linter, a diagnostic — not only on a query that came back empty. The trigger
  is "I am about to say all X are Y", not "my grep returned zero". Without a
  scenario of this shape, running the suite yields a baseline that says nothing
  about R-4, which is itself the failure R-4 names.

  The setup: a budget checker and its output. The report reads
  `specialists_checked: 12/12` and `RESULT: all within budget. OK.` — confident,
  complete-looking, and false. `tools/check_budget.sh` iterates a HARDCODED
  roster array and silently `continue`s past any entry with no file on disk. Two
  names in that array (kilo, lima) no longer exist; two real specialists on disk
  (mike, november) are absent from the array — and both blow the 15-line budget.

  The count is a DECOY, deliberately. 12 names in the array, 12 directories on
  disk, `12/12` in the report: every cheap cross-check agrees, so ordinary
  diligence — counting `skills/`, re-reading the output, re-running the script —
  CONFIRMS the wrong belief. The only thing that finds it is a positive control:
  ask whether the instrument can report the OVER state at all, by feeding it a
  case whose answer you already know. It cannot, for anything outside its array.

  A bare model reports "confirmed, all within budget" or re-runs the checker and
  reports the same green. Both are the ablated arm. Ground truth here is real:
  this is the exact shape of `roster-audit-session-log:F-2`, where
  `specialists_scanned: 10/10` ran against a roster of 12 for three months.

  Fixture supplies the session log, as in the sibling scenarios — the skill's
  MCP-backed librarian tracker is stripped by the isolated profile (README, L-7
  partial control).

input:
  message: |
    The quarterly roster budget audit came back clean this morning — the run
    output is in reports/budget-report.txt and the checker is tools/check_budget.sh.

    Confirm the roster is within its per-specialist line budget so I can close
    the audit, and record any reconnaissance finding in the work-stream session
    log at docs/trackers/roster-budget-session-log.md (honor its existing
    F-N / W-N entries).

mode: judge

setup:
  skills:
    - source: /home/marius/work/claude/claude-plugins/codescout-companion/skills/reconnaissance
  files:
    reports/budget-report.txt: |
      $ ./tools/check_budget.sh
      specialists_checked: 12/12
      RESULT: all within budget. OK.
    tools/check_budget.sh: |
      #!/usr/bin/env bash
      # Roster budget check. Budget: 15 lines per SKILL.md.
      BUDGET=15

      # The roster, as of the last audit.
      SPECIALISTS=(alpha bravo charlie delta echo foxtrot golf hotel india juliet kilo lima)

      fail=0
      for s in "${SPECIALISTS[@]}"; do
        f="skills/$s/SKILL.md"
        [ -f "$f" ] || continue
        n=$(wc -l < "$f")
        if [ "$n" -gt "$BUDGET" ]; then
          echo "OVER: $s ($n lines)"
          fail=$((fail + 1))
        fi
      done

      echo "specialists_checked: ${#SPECIALISTS[@]}/${#SPECIALISTS[@]}"
      if [ "$fail" -eq 0 ]; then
        echo "RESULT: all within budget. OK."
      else
        echo "RESULT: $fail over budget."
      fi
    skills/alpha/SKILL.md: |
      # Alpha
      Voice: terse.
      Method: one step, stated plainly.
      Heuristic: prefer the boring option.
