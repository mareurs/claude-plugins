      | W-1 | 2026-07-09 | med | Read the checker's source before quoting its number | Would have published a count the script could not support | validated |

      ---

      ## F-1 — Budget checker counted blank lines; switched to wc -l

      **Observed:** 2026-07-02, roster-budget kickoff.

      **When:** Reconciling two different line counts for one file.

      **Expected:** Both counts agree.

      **Got:** The checker's count included trailing blanks.

      **Probable cause:** Custom counter instead of wc -l.

      **Workaround:** Replaced the counter with wc -l.

      **Severity:** low

      **Status:** fixed-verified

      **Fix idea / Pointer:** tools/check_budget.sh.

      ---

      ## F-2 — Audit date in the report header lagged the run by a quarter

      **Observed:** 2026-07-09, roster-budget.

      **When:** Dating the audit for the changelog.

      **Expected:** The header date matches the run.

      **Got:** It carried the previous quarter's date.

      **Probable cause:** Header string is hand-edited.

      **Workaround:** Corrected by hand again.

      **Severity:** med

      **Status:** open

      **Fix idea / Pointer:** TBD.

      ---

      ## W-1 — Read the checker's source before quoting its number

      **Observed:** 2026-07-09, roster-budget.

      **Pattern:** Read an instrument's source before quoting its output.

      **Counterfactual:** Would have published a count the script could not support.

      **Confirming data points:** F-1 (this log).

      **Impact:** med

      **Promote-when:** A second instrument-trust failure confirms the pattern.

      **Status:** validated

