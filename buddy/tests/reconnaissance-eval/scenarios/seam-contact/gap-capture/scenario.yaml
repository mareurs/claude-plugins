name: "recon scouts the seam, catches plan drift, files it as a friction entry in the recon box"
description: >
  A seam-contact edit task: the plan asserts the code has a field that the
  actual source does NOT have. A bare model edits straight from the plan and
  hits the fictional field, or silently invents it. The reconnaissance skill
  scouts the real shape FIRST (reads the struct), states the plan-vs-reality
  gap, and files it as a `friction` entry in the repository's recon box
  (`codescout box recon add --kind friction`), with a title that starts with the
  topic and a body of the three worklog fields. A pass here can only come from
  the skill: a bare model has no notion of a recon box or of the
  scout-before-edit ordering. The fixture supplies the box (its readme and three
  prior entries): the skill's `codescout box new worklog recon` step is not
  exercised here.

input:
  message: |
    Implement Task 1 of the auth-refactor plan below in this repo, then record
    any reconnaissance finding in the repository's recon box.

    PLAN — Task 1: In src/session.py, make `SessionToken.expired()` return True
    once the token is past its deadline. Use the token's `.expiry_ts` field
    (a unix timestamp) versus the current time. The plan's test asserts
    `tok.expired() is True` for a stale token.

    Before you edit, the recon box docs/trackers/streams/recon holds the
    repository's reconnaissance log; read its existing entries.

mode: judge

setup:
  skills:
    - source: /home/marius/work/claude/claude-plugins/codescout-companion/skills/reconnaissance
  files:
    src/session.py: |
      """Session token model. Stable contract: see tests/test_session.py."""
      import time
      from dataclasses import dataclass


      @dataclass
      class SessionToken:
          token: str
          # NOTE: the deadline field is `deadline_unix`, NOT `expiry_ts`.
          # `expiry_ts` does not exist on this struct.
          deadline_unix: int

          def remaining(self) -> int:
              return self.deadline_unix - int(time.time())

      # `expired()` is not implemented yet — Task 1 adds it.
    tests/test_session.py: |
      import time
      from src.session import SessionToken


      def test_expired_true_for_stale():
          tok = SessionToken(token="x", deadline_unix=int(time.time()) - 10)
          assert tok.expired() is True


      def test_expired_false_for_fresh():
          tok = SessionToken(token="x", deadline_unix=int(time.time()) + 10)
          assert tok.expired() is False
    docs/trackers/streams/recon/readme.md: |
      ---
      kind: collection
      title: Reconnaissance log
      commit: new-entries
      entry_kinds:
      - friction
      - win
      - residual
      exit_when: the repository stops using reconnaissance
      hot_cap: 12
      initial_status: open
      key_style: dated
      stale_after: 30d
      statuses:
        open: open
        done: terminal
        promoted: terminal
        dropped: terminal
      template: worklog
      ---

      # Reconnaissance log

      The log of one work stream. It ends: when every entry is terminal, the stream is archived whole.

      ## What goes here

      - `friction`: something that cost a failed call, a retry or a wrong turn. Say what happened and what you did.
      - `win`: a way of working that prevented a worse outcome. Say what would have happened without it.
      - `residual`: work that this stream leaves undone.

      ## How an entry ends

      - `done`: finished, and nothing is worth keeping.
      - `promoted`: the lesson went to a box that lasts, or to a file. The entry names it in a `**Promoted to:**` line.
      - `dropped`: nobody will act on it. The entry says why in one line.

      A confirmed win stays `open` until it is promoted or dropped.

      ## Entry template

      **What happened:** <one or two lines>

      **What I did:** <the recovery, or the way of working>

      **Worth keeping:** <the lesson in one line, or "nothing">

    docs/trackers/streams/recon/2026-06-10-auth-refactor-plan-named-src-auth-py-module-is-src-session-py.md: |
      ---
      kind: entry
      status: done
      title: 'auth-refactor: plan named src/auth.py; module is src/session.py'
      closed: 2026-06-10
      created: 2026-06-10
      entry_kind: friction
      log:
      - '2026-06-10 open created codescout:fixture'
      - '2026-06-10 open -> done codescout:fixture'
      status_since: 2026-06-10
      ---

      **What happened:** Kickoff. The plan named src/auth.py; the token model lives in src/session.py.

      **What I did:** Edited src/session.py instead.

      **Worth keeping:** Scout the file the plan names before opening it.

      ## Closed

      fixed

    docs/trackers/streams/recon/2026-06-12-auth-refactor-grep-scoped-to-file-missed-a-cross-module-caller.md: |
      ---
      kind: entry
      status: open
      title: 'auth-refactor: grep scoped to file missed a cross-module caller'
      created: 2026-06-12
      entry_kind: friction
      log:
      - '2026-06-12 open created codescout:fixture'
      status_since: 2026-06-12
      ---

      **What happened:** A file-scoped grep for callers of `remaining()` missed a caller in src/middleware.py.

      **What I did:** Re-ran grep at workspace root.

      **Worth keeping:** Scope a caller search to the workspace, not the changing file.

    docs/trackers/streams/recon/2026-06-12-auth-refactor-scouted-caller-sites-before-a-signature-change.md: |
      ---
      kind: entry
      status: open
      title: 'auth-refactor: scouted caller sites before a signature change'
      created: 2026-06-12
      entry_kind: win
      log:
      - '2026-06-12 open created codescout:fixture'
      status_since: 2026-06-12
      ---

      **What happened:** Read all caller sites before changing a method signature. Without the scout, 3 call sites in src/middleware.py would have broken at import time.

      **What I did:** Read the callers first.

      **Worth keeping:** A second signature change confirms the pattern; then promote it.

assertions:
  judge:
    - type: rubric
      rubric: >
        The task asked the model to implement a plan whose code references a
        field (`expiry_ts`) that the actual src/session.py does NOT have — the
        real field is `deadline_unix`. The recon box already holds three entries
        (two frictions and a win, all titled `auth-refactor: ...`). Score 1.0
        ONLY IF the response does ALL of:
        (1) Scouts BEFORE editing — surfaces that it read the actual
            src/session.py shape, and states the plan-vs-reality gap explicitly
            (plan said `.expiry_ts`; the struct has `.deadline_unix`, no
            `expiry_ts` field). The implementation it writes uses
            `deadline_unix`, not the fictional `expiry_ts`.
        (2) Files the gap as a NEW `friction` entry in the recon box:
            `codescout box recon add --kind friction --title "auth-refactor: ..."`
            (not `--kind win`), whose title starts with the topic
            `auth-refactor:` and is not the title of an existing entry. If the
            profile cannot run the command, a new entry file under
            docs/trackers/streams/recon/ with the same title and `entry_kind:
            friction` counts.
        (3) Writes the entry with the three worklog fields: `**What happened:**`
            states the plan's `.expiry_ts` against the reality (`.deadline_unix`,
            no such field) in src/session.py, `**What I did:**` states the
            workaround, and `**Worth keeping:**` states the lesson in one line.
            The entry names the concrete identifier (`expiry_ts` /
            `deadline_unix`) and the file (src/session.py) — vague entries do
            not count.
        (4) Announces a one-line scout outcome that cites the new entry by its
            key as `[[<entry key>]]`.
        Score 0 if the response just implements the plan (with or without using
        the fictional `expiry_ts`) and never files a recon-box entry, OR if it
        edits before scouting. Losing any one of (1)-(4) caps the score below
        the threshold.
      threshold: 0.7
      expected_pass: true
