# buddy's one third-party runtime dependency is PyYAML (scripts/consolidate.py
# imports `yaml` at module level; hook_entry.run_session_start guards that
# import, so a missing PyYAML costs only consolidation nudges, not the rest of
# SessionStart — see CLAUDE.md § buddy). Everything else runs on the Python
# standard library alone (urllib for the judge HTTP calls, not `requests`).
# Requires Python 3.13+. Version is owned by .claude-plugin/plugin.json
# (single source of truth — not duplicated here). Not declared as a
# [project.dependencies] table here because this file has no [project]
# section — it's pytest config only, not a packaging manifest.

[tool.pytest.ini_options]
pythonpath = ["."]
